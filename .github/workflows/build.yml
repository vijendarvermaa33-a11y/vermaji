name: Build Vijendra Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          if [[ -f "settings.gradle" && -f "build.gradle" && -f "app/build.gradle" ]]; then
            PROJECT_DIR="."
          else
            ZIP="Vijendra_Project.zip"
            if [[ -f "$ZIP" ]]; then
              rm -rf .android-source
              mkdir -p .android-source
              unzip -q "$ZIP" -d .android-source
            fi
            PROJECT_DIR=$(find . -type f -name settings.gradle -not -path './.git/*' -not -path './.android-source/*/.git/*' -print | head -n 1 | xargs -r dirname || true)
            if [[ -z "$PROJECT_DIR" && -f ".android-source/Vijendra_Project/settings.gradle" ]]; then
              PROJECT_DIR=".android-source/Vijendra_Project"
            fi
          fi
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: Android project not found. Expected settings.gradle + build.gradle + app/build.gradle."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Generate Gradle wrapper 8.9
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vijendra-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
